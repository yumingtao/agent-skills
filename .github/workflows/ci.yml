name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint sync scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Syntax check
        run: bash -n sync/*.sh

      - name: Shellcheck
        run: shellcheck sync/*.sh

  validate:
    name: Validate collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collection integrity
        run: sync/check.sh --collection-only

      - name: Diagram checker syntax
        run: node --check skills/diagram-generator/scripts/check-diagram.mjs

      - name: Verdict validator syntax
        run: node --check skills/insight-challenge/scripts/validate-verdict.mjs

      - name: Verdict validator behavior gate (known-good fixture)
        run: node skills/insight-challenge/scripts/validate-verdict.mjs skills/insight-challenge/tests/fixtures/verdict-good.json

      - name: Verdict validator rejection gate (bad fixture)
        run: |
          set +e
          out=$(node skills/insight-challenge/scripts/validate-verdict.mjs skills/insight-challenge/tests/fixtures/verdict-bad.json 2>&1)
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::validator accepted a known-bad fixture"
            echo "$out"
            exit 1
          fi
          echo "$out" | grep -q "IC-V01" \
            && echo "$out" | grep -q "IC-V02" \
            && echo "$out" | grep -q "IC-V05" \
            && echo "$out" | grep -q "IC-V09" \
            && echo "$out" | grep -q "IC-V11" \
            && echo "$out" | grep -q "IC-V12" \
            && echo "$out" | grep -q "IC-V13" \
            || { echo "::error::validator failed without reporting the injected defects"; echo "$out"; exit 1; }
          echo "validator correctly rejected the bad fixture"

      - name: Verdict validator modes (stdin + markdown extraction)
        run: |
          cat skills/insight-challenge/tests/fixtures/verdict-good.json | node skills/insight-challenge/scripts/validate-verdict.mjs -
          cat > /tmp/ci-report.md <<'EOF'
          # Report

          ```json
          {
            "finding_id": "CI-1",
            "challenge_result": "confirmed",
            "confidence": 90,
            "reasoning": "md mode works",
            "supporting_evidence": ["src/a.ts line 1: proof"]
          }
          ```
          EOF
          node skills/insight-challenge/scripts/validate-verdict.mjs /tmp/ci-report.md
          printf '# Report\n\n```json\n{"foo": 1}\n```\n' > /tmp/ci-noverdict.md
          set +e
          node skills/insight-challenge/scripts/validate-verdict.mjs /tmp/ci-noverdict.md > /dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "::error::validator accepted markdown without a verdict block"; exit 1; fi
          echo "validator modes OK"

      - name: Diagram checker behavior gate (known-good fixture)
        run: node skills/diagram-generator/scripts/check-diagram.mjs skills/diagram-generator/tests/fixtures/example-commerce-system-map.html

      - name: Diagram checker rejection gate (bad fixture)
        run: |
          set +e
          out=$(node skills/diagram-generator/scripts/check-diagram.mjs skills/diagram-generator/tests/fixtures/bad-injected-defects.html)
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::checker accepted a known-bad fixture"
            echo "$out"
            exit 1
          fi
          echo "$out" | grep -q "Placeholder text still present" \
            && echo "$out" | grep -q "exceeds viewBox" \
            && echo "$out" | grep -q "unknown node id" \
            && echo "$out" | grep -q "escapes the region bounds" \
            && echo "$out" | grep -q "sits too close to region" \
            || { echo "::error::checker failed without reporting the injected defects"; echo "$out"; exit 1; }
          echo "checker correctly rejected the bad fixture:"
          echo "$out" | grep -E "✗|FAILED" || true
