name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint sync scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Syntax check
        run: bash -n sync/*.sh

      - name: Shellcheck
        run: shellcheck sync/*.sh

  validate:
    name: Validate collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collection integrity
        run: sync/check.sh --collection-only

      - name: Diagram checker syntax
        run: node --check skills/diagram-generator/scripts/check-diagram.mjs

      - name: Diagram checker behavior gate (known-good fixture)
        run: node skills/diagram-generator/scripts/check-diagram.mjs skills/diagram-generator/tests/fixtures/example-commerce-system-map.html

      - name: Diagram checker rejection gate (bad fixture)
        run: |
          set +e
          out=$(node skills/diagram-generator/scripts/check-diagram.mjs skills/diagram-generator/tests/fixtures/bad-injected-defects.html)
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "::error::checker accepted a known-bad fixture"
            echo "$out"
            exit 1
          fi
          echo "$out" | grep -q "Placeholder text still present" \
            && echo "$out" | grep -q "exceeds viewBox" \
            && echo "$out" | grep -q "unknown node id" \
            || { echo "::error::checker failed without reporting the injected defects"; echo "$out"; exit 1; }
          echo "checker correctly rejected the bad fixture:"
          echo "$out" | grep -E "✗|FAILED" || true
