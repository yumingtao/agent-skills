# yumingtao-dsh-skills bundle patch: installs four agent skills into the DSH
# skill discovery root on web profile boot.
#
# Activate with:
#   dsh plugin --profile web add yumingtao-dsh-skills
#
# On boot the row's node half copies the packaged skill directories into the
# user-global skill root (~/.agents/skills), where DSH (and Codex CLI) discover
# them. Installation is idempotent: existing skill directories are overwritten
# only when the packaged files differ (pass force: true in the row config to
# always overwrite).
- insert:
  - id: yumingtao-dsh-skills
    name: 'yumingtao-dsh-skills'
