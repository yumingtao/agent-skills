# yumingtao-diagram-generator bundle: installs the diagram-generator agent skill into the DSH
# skill discovery root on web profile boot.
#
# Activate with:
#   dsh plugin --profile web add yumingtao-diagram-generator
#
# On boot the row copies the packaged skill directory into the user-global
# skill root (~/.agents/skills). Installation is idempotent.
- insert:
  - id: yumingtao-diagram-generator
    name: 'yumingtao-diagram-generator'
