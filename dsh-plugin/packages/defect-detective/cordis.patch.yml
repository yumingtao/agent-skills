# yumingtao-defect-detective bundle: installs the defect-detective agent skill into the DSH
# skill discovery root on web profile boot.
#
# Activate with:
#   dsh plugin --profile web add yumingtao-defect-detective
#
# On boot the row copies the packaged skill directory into the user-global
# skill root (~/.agents/skills). Installation is idempotent.
- insert:
  - id: yumingtao-defect-detective
    name: 'yumingtao-defect-detective'
